<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="uft-8">
        <meta name="viewport" content="width=device,initial-scale=1.0">
        <title>WDD 130 | HTML Form - User Poll</title>
        <meta name="description" content="poll form, learning html.">
        <meta name="author" content="David Navratil">
    </head>
    <body>
        <header>
            <h1> WDD 130 | David Navratil | HTML Form - User Poll</h1>
        </header>
        <main>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                    <label for="usermail">Email:</label>
                    <input type="email" id="usermail" name="usermail">
                </fieldset>
                <fieldset>
                    <legend>Questions</legend>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chorme</option>
                        <option value="safari">Safari</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="opera">Opera</option>
                        <option value="other">Other</option>
                    </select>
                    <label for="pet">Do you have any pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                    <label for="feedback">List the places where have you lived</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Kaui Hawaii, Orange County California, Jihlava Czechia, Saint George Utah"></textarea>
                </fieldset>
                <button type="submit">Submit Poll</button>
            </form>
        </main>
        <footer>
            <p>©2024 | HTML Form - User Poll Activity | David Navratil</p>
        </footer>
    </body>
</html>
