<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Contact Us | David Navratil</title>
        <meta name="description" content="contact us, white water rafting, splash squad rafting, contact splash squad rafting.">
        <meta name="author" content="David Navratil">
        <link rel="stylesheet" href="styles/rafting.css">
    </head>
    <body>
        <header>
            <img src="images/logo.png" alt="Rafting Site Logo">
            <nav>
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Constact Us</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <article class="contact_info">
                <h3>Contact Info</h3>
                <p>Address: 540 Haul Rd, Page, AZ 86040</p>
                <p>Phone: +1 (928)435-1234</p>
                <p>Email: contactus@spalshsquad.com</p>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d25522.09389018825!2d-111.47739182951969!3d36.90800595951411!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87341350b7d58b81%3A0x35831c0758ad6433!2s540%20Haul%20Rd%2C%20Page%2C%20AZ%2086040!5e0!3m2!1sen!2sus!4v1720894104407!5m2!1sen!2sus" 
                width="300" height="225" style="border:0;" allowfullscreen="" 
                loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </article>
            <article class="crew_holder">
                <h3 id="crew_h3">Our Crew</h3>
                <div class="crew">
                    <figure>
                        <img src="images/employee1.png" alt="Tim Cook">
                        <figcaption>Tim Cook Ride Planner</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee2.png" alt="Sarah Potter">
                        <figcaption>Sarah Potter Safety Instructor</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee3.png" alt="Paul Neumann">
                        <figcaption>Paul Neumann Equipment Manager</figcaption>
                    </figure>
                </div>
            </article>
            <div id="user_message_box">
                <form class="user_message">
                    <label for="name">Type your name here</label>
                    <input type="text" id="name" name="name">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email">
                    <fieldset>
                        <input type="radio" id="general_inquiry" name="question_type" value="General_Inquiry">
                        <label for="general_inquiry">General Inquiry</label><br>
                        <input type="radio" id="reservation_question" name="question_type" value="Reservation_Question">
                        <label for="reservation_question">Reservation Question</label><br>
                        <input type="radio" id="web_suggestion" name="question_type" value="Web_Suggestion">
                        <label for="web_suggestion">Website Suggestion</label>
                    </fieldset>
                    <textarea id="message" name="question_type" rows="4" placeholder="Type your message here..."></textarea>
                    <fieldset>
                        <label for="subscription">Please subscribe me to the monthly newsletter</label>
                        <input type="checkbox" id="subscription" name="subscription">
                    </fieldset>
                    <button type="submit">Submit your message</button>
                </form>
            </div>
        </main>
        <footer>
            <div class="wireframe">
                <a href="https://app.moqups.com/e7riSiwAi2VSZjRI7O78lSaUPauWtZaL/view/page/ad64222d5">Wireframe for this page</a>
            </div>
            <p>©2024 | Splash Squad Rafting | David Navratil</p>
            <nav class="socilalinks">
                <a href="https://facebook.com">
                    <img src="images/facebook-alt.webp" alt="Facebook" class="facebook">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.webp" alt="Instagram">
                </a>
                <a href="https://youtube.com">
                    <img src="images/youtube.webp" alt="Youtube">
                </a>
            </nav>
        </footer>
    </body>
</html>
